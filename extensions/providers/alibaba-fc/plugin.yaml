apiVersion: runfabric/v1
kind: provider
id: alibaba-fc
name: alibaba-fc
description: External provider plugin for Alibaba FC
version: 0.1.0
pluginVersion: 1
executable: ./bin/alibaba-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: ALIBABA_ACCESS_KEY_ID
    header: X-Provider-Alibaba-Access-Key-Id
    required: true
  - envKey: ALIBABA_ACCESS_KEY_SECRET
    header: X-Provider-Alibaba-Access-Key-Secret
    required: true
  - envKey: ALIBABA_FC_ACCOUNT_ID
    header: X-Provider-Alibaba-Account-Id
    required: true
  - envKey: ALIBABA_FC_REGION
    header: X-Provider-Alibaba-Region
    placeholder: "cn-hangzhou"
# scaffold shapes `runfabric init` output for this provider (see manifest ScaffoldSpec).
scaffold:
  comment: "Provider: alibaba-fc — see docs for credentials and trigger support"
permissions: { fs: true, env: true, network: true, cloud: true }
