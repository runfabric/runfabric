apiVersion: runfabric/v1
kind: provider
id: digitalocean-functions
name: digitalocean-functions
description: External provider plugin for DigitalOcean Functions
version: 0.1.0
pluginVersion: 1
executable: ./bin/digitalocean-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: DIGITALOCEAN_ACCESS_TOKEN
    header: X-Provider-Digitalocean-Access-Token
    required: true
  - envKey: DO_APP_REPO
    header: X-Provider-Digitalocean-App-Repo
    required: true
    placeholder: "owner/repo"
  - envKey: DO_REGION
    header: X-Provider-Digitalocean-Region
    placeholder: "nyc"
permissions:
  fs: true
  env: true
  network: true
  cloud: true
