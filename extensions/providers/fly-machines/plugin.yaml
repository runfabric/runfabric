apiVersion: runfabric/v1
kind: provider
id: fly-machines
name: fly-machines
description: External provider plugin for Fly Machines
version: 0.1.0
pluginVersion: 1
executable: ./bin/fly-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: FLY_API_TOKEN
    header: X-Provider-Fly-Api-Token
    required: true
  - envKey: FLY_IMAGE
    header: X-Provider-Fly-Image
    required: true
    placeholder: "registry.fly.io/myapp:latest"
  - envKey: FLY_ORG_ID
    header: X-Provider-Fly-Org-Id
# scaffold shapes `runfabric init` output for this provider (see manifest ScaffoldSpec).
scaffold:
  comment: "Provider: fly-machines — set FLY_*; http only"
permissions:
  fs: true
  env: true
  network: true
  cloud: true
