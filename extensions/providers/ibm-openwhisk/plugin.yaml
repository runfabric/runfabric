apiVersion: runfabric/v1
kind: provider
id: ibm-openwhisk
name: ibm-openwhisk
description: External provider plugin for IBM OpenWhisk
version: 0.1.0
pluginVersion: 1
executable: ./bin/ibm-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: IBM_OPENWHISK_AUTH
    header: X-Provider-Ibm-Auth
    required: true
  - envKey: IBM_OPENWHISK_API_HOST
    header: X-Provider-Ibm-Api-Host
    placeholder: "https://us-south.functions.cloud.ibm.com"
  - envKey: IBM_OPENWHISK_NAMESPACE
    header: X-Provider-Ibm-Namespace
permissions: { fs: true, env: true, network: true, cloud: true }
