apiVersion: runfabric/v1
kind: provider
id: kubernetes
name: kubernetes
description: External provider plugin for Kubernetes
version: 0.1.0
pluginVersion: 1
executable: ./bin/kubernetes-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: KUBECONFIG
    required: true
    placeholder: "~/.kube/config"
  - envKey: GHCR_REGISTRY
  - envKey: GHCR_USER
  - envKey: GHCR_TOKEN
# scaffold shapes `runfabric init` output for this provider (see manifest ScaffoldSpec).
scaffold:
  comment: "Provider: kubernetes — set KUBECONFIG; supports http, cron"
permissions:
  fs: true
  env: true
  network: true
  cloud: true
