apiVersion: runfabric/v1
kind: provider
id: netlify
name: netlify
description: External provider plugin for Netlify
version: 0.1.0
pluginVersion: 1
executable: ./bin/netlify-plugin
capabilities: [doctor, plan, deploy, remove, invoke, logs]
supportsRuntime: [nodejs, python]
supportsTriggers: [http]
supportsResources: []
credentials:
  - envKey: NETLIFY_AUTH_TOKEN
    header: X-Provider-Netlify-Auth-Token
    required: true
  - envKey: NETLIFY_SITE_ID
    header: X-Provider-Netlify-Site-Id
permissions:
  fs: true
  env: true
  network: true
  cloud: true
