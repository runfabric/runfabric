apiVersion: runfabric.io/plugin/v1
kind: router
id: azure-traffic-manager
name: Azure Traffic Manager Router
description: External router plugin for Azure Traffic Manager sync
version: 0.1.0
pluginVersion: 1
executable: ./bin/azure-traffic-manager-router
capabilities:
  - sync
credentials:
  - envKey: RUNFABRIC_ROUTER_API_TOKEN
    fallback: AZURE_ACCESS_TOKEN
  - envKey: AZURE_TRAFFIC_MANAGER_PROFILE_ID
  - envKey: AZURE_API_BASE_URL
    placeholder: "https://management.azure.com"
# fallback = the azure provider key: one Azure credential serves deploy and
# traffic-manager sync. Per-request headers ride the shared router group.
# scaffold: uniform init-scaffold surface across plugin kinds (see manifest ScaffoldSpec).
scaffold:
  comment: "Router: azure-traffic-manager — Azure Traffic Manager for fabric active-active routing"
permissions:
  fs: false
  env: true
  network: true
  cloud: true

