apiVersion: runfabric.io/plugin/v1
kind: router
id: ns1
name: NS1 Router
description: External router plugin for NS1 DNS sync
version: 0.1.0
pluginVersion: 1
executable: ./bin/ns1-router
capabilities:
  - sync
credentials:
  - envKey: RUNFABRIC_ROUTER_API_TOKEN
    fallback: NS1_API_KEY
  - envKey: NS1_API_BASE_URL
    placeholder: "https://api.nsone.net"
# fallback = native NS1 key, so existing NS1 setups work without the
# router-specific var. Per-request headers ride the shared router group.
permissions:
  fs: false
  env: true
  network: true
  cloud: true

