apiVersion: runfabric.io/plugin/v1
kind: router
id: route53
name: Route53 Router
description: External router plugin for Route53 DNS sync
version: 0.1.0
pluginVersion: 1
executable: ./bin/route53-router
capabilities:
  - sync
# No credentials block: route53 authenticates via the AWS default credential
# chain (env, profile, IMDS, IRSA) — no runfabric-specific token vars.
# scaffold: uniform init-scaffold surface across plugin kinds (see manifest ScaffoldSpec).
scaffold:
  comment: "Router: route53 — AWS Route 53 DNS for fabric active-active routing"
permissions:
  fs: false
  env: true
  network: true
  cloud: true

