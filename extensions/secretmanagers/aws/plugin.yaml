apiVersion: runfabric.io/plugin/v1
kind: secret-manager
id: aws-secret-manager
name: AWS Secret Manager
description: Resolves aws-sm:// secret references from AWS Secrets Manager
version: 0.1.0
pluginVersion: 1
executable: ./bin/aws-secret-manager
capabilities:
  - resolve-secret
  - scheme:aws-sm
credentials:
  - envKey: RUNFABRIC_SM_AWS_ACCESS_KEY_ID
    header: X-Secret-Aws-Access-Key-Id
    placeholder: "AKIA..."
  - envKey: RUNFABRIC_SM_AWS_SECRET_ACCESS_KEY
    header: X-Secret-Aws-Secret-Access-Key
    placeholder: "secret"
  - envKey: RUNFABRIC_SM_AWS_SESSION_TOKEN
    header: X-Secret-Aws-Session-Token
  - envKey: RUNFABRIC_SM_AWS_REGION
    header: X-Secret-Aws-Region
    placeholder: "us-east-1"
permissions:
  fs: false
  env: true
  network: true
  cloud: true
