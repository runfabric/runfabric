apiVersion: runfabric.io/plugin/v1
kind: secret-manager
id: azure-key-vault-secret-manager
name: Azure Key Vault Secret Manager
description: Resolves azure-kv:// secret references via Azure Key Vault
version: 0.1.0
pluginVersion: 1
executable: ./bin/azure-key-vault-secret-manager
capabilities:
  - resolve-secret
  - scheme:azure-kv
  - scheme:azure-keyvault
credentials:
  - envKey: AZURE_KEY_VAULT_NAME
    required: true
    placeholder: "my-vault"
# Addressing only — auth rides the ambient az/Azure identity
# (X-Provider-Azure-* per daemon request).
permissions:
  fs: false
  env: true
  network: true
  cloud: true
