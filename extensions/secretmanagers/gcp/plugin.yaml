apiVersion: runfabric.io/plugin/v1
kind: secret-manager
id: gcp-secret-manager
name: GCP Secret Manager
description: Resolves gcp-sm:// secret references via gcloud Secret Manager access
version: 0.1.0
pluginVersion: 1
executable: ./bin/gcp-secret-manager
capabilities:
  - resolve-secret
  - scheme:gcp-sm
credentials:
  - envKey: GCP_PROJECT_ID
    placeholder: "my-project"
  - envKey: GOOGLE_CLOUD_PROJECT
# Addressing only — auth rides the ambient gcloud/ADC identity
# (X-Provider-Gcp-* per daemon request).
permissions:
  fs: false
  env: true
  network: true
  cloud: true
