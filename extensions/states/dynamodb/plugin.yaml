apiVersion: runfabric.io/plugin/v1
kind: state
id: dynamodb
name: DynamoDB State Backend
description: External state backend plugin for DynamoDB receipts with local journals/locks
version: 0.1.0
pluginVersion: 1
executable: ./bin/dynamodb-state
capabilities:
  - state:dynamodb
  - backend:dynamodb
credentials:
  - envKey: RUNFABRIC_DYNAMODB_TABLE
    required: true
# AWS identity: the default chain, or the shared scoped identity
# RUNFABRIC_STATE_AWS_* (X-State-Aws-* per daemon request) declared at the
# subsystem level (providerpolicy.StateAWSCredentialVars), not per plugin.
permissions:
  fs: true
  env: true
  network: true
  cloud: true
