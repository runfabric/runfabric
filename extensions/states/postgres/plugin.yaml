apiVersion: runfabric.io/plugin/v1
kind: state
id: postgres
name: Postgres State Backend
description: External state backend plugin for Postgres receipts with local journals/locks
version: 0.1.0
pluginVersion: 1
executable: ./bin/postgres-state
capabilities:
  - state:postgres
  - backend:postgres
credentials:
  - envKey: RUNFABRIC_STATE_POSTGRES_URL
    header: X-State-Postgres-Url
    required: true
    placeholder: "postgres://user:pass@localhost:5432/runfabric"
# scaffold shapes the `runfabric init` backend: block for this state backend.
scaffold:
  config:
    - key: postgresConnectionStringEnv
      value: "RUNFABRIC_STATE_POSTGRES_URL"
    - key: postgresTable
      value: "runfabric_receipts"
permissions:
  fs: true
  env: true
  network: true
  cloud: false
