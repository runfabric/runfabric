apiVersion: runfabric.io/plugin/v1
kind: state
id: s3
name: S3 State Backend
description: External state backend plugin for S3 receipts with local journals/locks
version: 0.1.0
pluginVersion: 1
executable: ./bin/s3-state
capabilities:
  - state:s3
  - backend:s3
credentials:
  - envKey: RUNFABRIC_S3_BUCKET
    required: true
  - envKey: RUNFABRIC_S3_PREFIX
  - envKey: RUNFABRIC_DYNAMODB_TABLE
# scaffold shapes the `runfabric init` backend: block for this state backend.
scaffold:
  config:
    - key: s3Bucket
      value: "${env:RUNFABRIC_S3_BUCKET}"
    - key: s3Prefix
      value: "runfabric/dev"
    - key: lockTable
      value: "${env:RUNFABRIC_DYNAMODB_TABLE}"
permissions:
  fs: true
  env: true
  network: true
  cloud: true
