apiVersion: runfabric.io/plugin/v1
kind: state
id: sqlite
name: SQLite State Backend
description: External state backend plugin for SQLite receipts with local journals/locks
version: 0.1.0
pluginVersion: 1
executable: ./bin/sqlite-state
capabilities:
  - state:sqlite
  - backend:sqlite
# scaffold shapes the `runfabric init` backend: block for this state backend.
scaffold:
  config:
    - key: sqlitePath
      value: ".runfabric/state.db"
permissions:
  fs: true
  env: true
  network: false
  cloud: false
